[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cubes-archive"
version = "0.1.0"
description = "Create, inspect, verify, and run Executable Python Archives (.epa)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Cubes, Studio." }]
dependencies = []

[project.scripts]
cubes = "cubes_archive.cli:main"

[tool.setuptools]
packages = ["cubes_archive"]
